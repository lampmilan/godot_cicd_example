name: Godot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Continuous Integration (Lint & Test)
  # -------------------------------------------------------------
  ci:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pre-Import Assets
        run: godot --headless --editor --quit || true

      - name: Run GDScript Linter
        run: |
          godot --headless -s res://addons/gdscript-linter/analyzer/analyze-cli.gd

      - name: Run GUT Unit Tests
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.1.stable ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Import Assets & Test Web Build
        run: |
          godot --headless --editor --quit || true
          mkdir -p build/test
          godot --headless --export-release "Web" build/test/index.html

  # -------------------------------------------------------------
  # STAGE 2: Continuous Delivery (Export & Deploy)
  # -------------------------------------------------------------
  export-and-deploy:
    name: Export Web & Push to Itch.io
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    # Ensures CD runs ONLY if the CI job completes successfully
    needs: ci

    # Only run CD if triggered by a Git Tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Inject Git Tag into project.godot
        shell: bash
        run: |
          # Retrieve whatever tag string triggered the workflow
          # (e.g. "0.1.0", "v.0.1.0", "2026.08.10", "playtest-alpha")
          BUILD_VERSION="${GITHUB_REF_NAME}"
          
          echo "Injecting Version: $BUILD_VERSION"
          
          # Replace config/version inside project.godot for this build run only
          sed -i 's/config\/version=.*/config\/version="'"$BUILD_VERSION"'"/' project.godot

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.1.stable ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Create Build Directory
        run: mkdir -v -p build/web

      - name: Build Web Export
        run: godot --headless --export-release "Web" build/web/index.html

      - name: Deploy to Itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          ITCH_GAME: ${{ secrets.ITCHIO_GAME_SLUG }}
        run: |
          apt-get update && apt-get install -y curl unzip
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler push build/web brewed-by-papi/godot-ci-cd-example:web

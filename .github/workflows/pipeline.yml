name: Godot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Continuous Integration (Lint & Test)
  # -------------------------------------------------------------
  ci:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run GDScript Linter
        run: |
          godot --headless -s res://addons/gdscript-linter/analyzer/analyze-cli.gd

      - name: Run GUT Unit Tests
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd

  # -------------------------------------------------------------
  # STAGE 2: Continuous Delivery (Export & Deploy)
  # -------------------------------------------------------------
  export-and-deploy:
    name: Export Web & Push to Itch.io
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    # Ensures CD runs ONLY if the CI job completes successfully
    needs: ci

    # Skip CD on Pull Requests; only run on pushes to main or manual triggers
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from Tag
        id: get_version
        shell: bash
        run: |
          # If triggered by a git tag v1.2.3, strip 'v'. Otherwise, fallback to 0.1.<github_run_number>
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG_NAME#v}"
          else
            VERSION="0.1.${{ github.run_number }}"
          fi

          # Split X.Y.Z into individual variables
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR=$MINOR" >> $GITHUB_OUTPUT
          echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
          echo "Full Version: $VERSION (Major: $MAJOR, Minor: $MINOR, Patch: $PATCH)"

      - name: Update version.gd
        run: |
          VERSION_FILE="VERSION.gd"  # Path to your Version class GDScript file

          sed -i 's/const MAJOR: int = .*/const MAJOR: int = ${{ steps.get_version.outputs.MAJOR }}/' "$VERSION_FILE"
          sed -i 's/const MINOR: int = .*/const MINOR: int = ${{ steps.get_version.outputs.MINOR }}/' "$VERSION_FILE"
          sed -i 's/const PATCH: int = .*/const PATCH: int = ${{ steps.get_version.outputs.PATCH }}/' "$VERSION_FILE"

          echo "Updated $VERSION_FILE:"
          cat "$VERSION_FILE"

      - name: Update project.godot Version
        run: |
          # Updates config/version="X.Y.Z" in project.godot
          sed -i 's/config\/version=.*/config\/version="${{ steps.get_version.outputs.MAJOR }}.${{ steps.get_version.outputs.MINOR }}.${{ steps.get_version.outputs.PATCH }}"/' project.godot

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.1.stable ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Create Build Directory
        run: mkdir -v -p build/web

      - name: Build Web Export
        run: godot --headless --export-release "Web" build/web/index.html

      - name: Deploy to Itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          ITCH_GAME: ${{ secrets.ITCHIO_GAME_SLUG }}
        run: |
          apt-get update && apt-get install -y curl unzip
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler push build/web $ITCH_USER/$ITCH_GAME:web
